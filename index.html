<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌟 COLA NO 13</title>
<meta name="description" content="Agenda de campanha do Lula em Minas Gerais, com mapa e calendário das atividades.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 -6 40 40'><rect width='40' height='28' rx='3' fill='%2312A82C'/><polygon points='20,4 35,14 20,24 5,14' fill='%23FFD400'/><circle cx='20' cy='14' r='5.8' fill='%230033CC'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800..900&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --vermelho:#E30613; --vermelho-escuro:#A8040D;
    --azul:#0033CC; --azul-escuro:#001F8F;
    --verde:#12A82C; --verde-escuro:#0B7A1F;
    --amarelo:#FFD400; --amarelo-escuro:#D1A800;
    --vinho:var(--azul-escuro); --ouro:var(--amarelo);
    --rosa:#F6F4F4; --papel:#FFFFFF; --fundo:#F4F3F3; --linha:#E4E0E0;
    --tinta:#1A1A1A; --cinza:#625C5C;
    /* cores por tipo de atividade */
    --t-ato:var(--azul); --t-rua:var(--vermelho); --t-reuniao:var(--verde);
    --t-esporte:var(--amarelo); --t-tv:#5B5B66; --t-eleicao:var(--vermelho-escuro);
    --larga:'Archivo','Arial Black',Impact,sans-serif;
    --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
    --texto:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:var(--texto);color:var(--tinta);background:var(--fundo)}
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--vinho);outline-offset:2px}

  #app{display:flex;height:100vh;overflow:hidden}

  /* ---------- Painel (metade esquerda) ---------- */
  #painel{width:50%;min-width:0;display:flex;flex-direction:column;background:var(--papel);
          border-right:1px solid var(--linha);z-index:500}
  .topo{padding:16px 24px 14px;border-bottom:1px solid var(--linha);display:flex;align-items:center;
        justify-content:space-between;flex-wrap:wrap;gap:12px 18px}
  .topo-titulo{flex:1 1 250px;min-width:0}
  .frase{flex:1 1 300px;max-width:430px;min-height:92px;display:flex;flex-direction:column;justify-content:center;gap:5px;
       padding:10px 14px 11px;border:2px solid var(--vermelho);border-radius:12px;background:#fff;text-align:left;
       cursor:pointer;transition:opacity .35s ease}
  .frase.troca{opacity:0}
  .frase-texto{font-family:var(--cond);font-weight:700;font-size:19px;line-height:1.15;color:var(--vermelho)}
  .frase-autor{font-size:12px;font-weight:600;color:var(--cinza)}
  @media (prefers-reduced-motion:reduce){.frase{transition:none}}
  .topo h1{margin:0;font-family:var(--cond);font-weight:800;font-size:36px;line-height:1;letter-spacing:.5px;color:var(--vermelho)}
  .topo p{margin:4px 0 0;font-size:13.5px;color:var(--cinza)}

  .painel-corpo{flex:1;min-height:0;display:grid;grid-template-columns:1fr;overflow-y:auto}
  .col-cal{padding:18px 24px 8px;min-width:0}
  .col-lista{min-width:0}
  .col-lista{padding:8px 24px 24px}

  /* Calendário: o bloco forte da página */
  .cal{background:var(--vermelho);color:#fff;border-radius:16px;padding:14px 12px 12px;container-type:inline-size}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-nav h2{margin:0;font-family:var(--cond);font-weight:700;font-size:clamp(19px,7cqi,24px)}
  .cal-nav button{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);
          background:transparent;color:#fff;cursor:pointer;font-size:18px;line-height:1}
  .cal-nav button:hover{background:rgba(255,255,255,.14)}
  .cal-nav button:disabled{opacity:.3;cursor:default;background:transparent}
  /* minmax(0,1fr) deixa as colunas encolherem de verdade em vez de empurrar o calendário para fora */
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(2px,1.2cqi,5px)}
  .cal-sem{font-family:var(--cond);font-weight:600;font-size:13px;text-align:center;opacity:.75;padding:2px 0 4px}
  .dia{position:relative;aspect-ratio:1/1;min-width:0;border-radius:clamp(6px,2.6cqi,10px);border:none;background:transparent;
       color:rgba(255,255,255,.45);font-family:var(--cond);font-weight:600;font-size:clamp(14px,5.6cqi,20px);cursor:default;
       display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
  .dia.vazio{visibility:hidden}
  .dia.tem{color:#fff;cursor:pointer;background:rgba(255,255,255,.1)}
  .dia.tem:hover{background:rgba(255,255,255,.22)}
  .dia.hoje{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
  .dia.sel{background:#fff;color:var(--vermelho)}
  .dia .qtd{font-family:var(--texto);font-weight:600;font-size:clamp(8.5px,3cqi,11px);line-height:1;margin-top:2px;opacity:.9}
  .dia .estrela{position:absolute;top:2px;right:3px;font-size:clamp(8px,2.8cqi,10px);line-height:1}
  .dia .ponto-lula,.leg-lula{display:inline-block;width:clamp(6px,2.2cqi,8px);height:clamp(6px,2.2cqi,8px);border-radius:50%;background:var(--ouro)}
  .dia .ponto-lula{position:absolute;top:4px;left:4px}
  .dia.sel .ponto-lula{box-shadow:0 0 0 1.5px var(--vinho)}
  .cal-rodape{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:10px;font-size:12.5px;gap:8px}
  .cal-rodape button{border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:20px;
          padding:5px 12px;cursor:pointer;font-weight:600;font-size:12.5px}
  .cal-rodape button[aria-pressed="true"]{background:#fff;color:var(--vermelho)}
  .cal-rodape span{opacity:.85}

  /* Filtros */
  .filtros{margin-top:16px}
  .filtros summary{cursor:pointer;font-family:var(--cond);font-weight:700;font-size:19px;padding:4px 0 6px}
  .filtros h3{margin:14px 0 7px;font-size:13px;font-weight:600;color:var(--cinza)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--linha);background:#fff;border-radius:20px;
        padding:5px 11px;font-size:13px;cursor:pointer;user-select:none}
  .chip .bola{width:11px;height:11px;border-radius:50%;flex:none}
  .chip[aria-pressed="false"]{opacity:.38}
  .chip.status[aria-pressed="true"]{border-color:var(--tinta)}
  select{width:100%;padding:8px 10px;border:1.5px solid var(--linha);border-radius:10px;background:#fff;font:inherit;font-size:13.5px}
  .acoes{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .acoes button{flex:1;min-width:110px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--linha);background:#fff;
        cursor:pointer;font-weight:600;font-size:13px}
  .acoes button:hover{border-color:var(--vermelho);color:var(--vermelho)}

  /* Lista do dia */
  .lista-topo{position:sticky;top:0;background:var(--papel);padding:10px 0 8px;z-index:2}
  .lista-topo h2{margin:0;font-family:var(--cond);font-weight:700;font-size:28px;line-height:1.05}
  .lista-topo p{margin:3px 0 0;font-size:13px;color:var(--cinza)}
  #lista{list-style:none;margin:4px 0 0;padding:0}
  .grupo-dia{font-family:var(--cond);font-weight:700;font-size:17px;margin:16px 0 4px;color:var(--vermelho-escuro)}
  .ev{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--linha);cursor:pointer}
  .ev:hover .ev-titulo{color:var(--vermelho)}
  .ev.ativo{background:var(--rosa);margin:0 -10px;padding:11px 10px;border-radius:10px;border-top-color:transparent}
  .ev-hora{font-family:var(--cond);font-weight:700;font-size:18px;line-height:1.1}
  .ev-hora small{display:block;font-weight:500;font-size:13px;color:var(--cinza)}
  .ev-titulo{font-weight:600;font-size:14.5px;line-height:1.3}
  .ev-local{font-size:13px;color:var(--cinza);margin-top:2px;line-height:1.35}
  .ev-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--fundo);color:var(--tinta)}
  .tag.tipo{color:#fff}
  .tag.lula{background:var(--vinho);color:var(--ouro)}
  .tag.pendente{background:#FFF1CC;color:#6B4E00}
  .tag.realizada{background:#E7EFE9;color:#2E5C3E}
  .tag.cancelada{background:#ECEAEA;color:#5E5656}
  .ev.cancelada .ev-titulo{text-decoration:line-through;color:var(--cinza)}
  .pin.cancelada{opacity:.4;filter:grayscale(1)}
  .tag.semlocal{background:#fff;border:1px dashed var(--cinza);color:var(--cinza)}
  .vazio-msg{padding:22px 0;color:var(--cinza);font-size:14px}

  /* ---------- Mapa (metade direita) ---------- */
  #mapaWrap{position:relative;flex:1;min-width:0}
  #map{position:absolute;inset:0;background:#EDEBEB}
  .pin{--c:var(--t-banca);width:22px;height:22px;border-radius:50%;background:var(--c);border:2.5px solid #fff;
       box-shadow:0 1px 4px rgba(40,0,0,.35);display:grid;place-items:center;color:#fff;
       font-family:var(--cond);font-weight:700;font-size:12px;line-height:1}
  .pin.lula{width:36px;height:36px;background:var(--vermelho);border:3px solid #fff;font-size:19px;color:var(--ouro);
       box-shadow:0 0 0 3px var(--ouro),0 2px 8px rgba(40,0,0,.45)}
  .pin.passado{opacity:.5}
  .pin.pendente{border-style:dashed}
  .pin.sel{box-shadow:0 0 0 4px rgba(215,20,26,.35),0 1px 4px rgba(40,0,0,.35)}
  .pin .n{position:absolute;top:-7px;right:-8px;min-width:17px;height:17px;border-radius:9px;background:var(--tinta);
       color:#fff;font-family:var(--texto);font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}
  .leaflet-div-icon.pin-wrap{background:none;border:none}

  #foraBH{position:absolute;top:12px;right:12px;z-index:600;max-width:min(300px,calc(100% - 80px));
       background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(40,0,0,.15);font-size:13px;display:none}
  #foraBH.on{display:block}
  #foraBH strong{display:block;font-size:12.5px;color:var(--cinza);font-weight:600;margin-bottom:5px}
  #foraBH button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:none;background:none;
       padding:4px 0;cursor:pointer;font-weight:600;font-size:13.5px}
  #foraBH button:hover{color:var(--vermelho)}
  #foraBH .bola{width:10px;height:10px;border-radius:50%;flex:none}

  /* Card que abre ao clicar no mapa */
  #card{position:absolute;left:14px;bottom:14px;z-index:700;width:min(390px,calc(100% - 28px));max-height:calc(100% - 28px);
       overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(40,0,0,.22);display:none}
  #card.on{display:block;animation:sobe .18s ease-out}
  @keyframes sobe{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){#card.on{animation:none}}
  .card-topo{position:sticky;top:0;background:var(--vermelho);color:#fff;padding:14px 48px 12px 16px;border-radius:16px 16px 0 0}
  .card-topo.lula{background:var(--vinho)}
  .card-topo.lula p{color:var(--ouro);opacity:1}
  .card-topo h2{margin:0;font-family:var(--cond);font-weight:700;font-size:22px;line-height:1.1}
  .card-topo p{margin:3px 0 0;font-size:12.5px;opacity:.9}
  .card-fechar{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:none;
       background:rgba(255,255,255,.18);color:#fff;cursor:pointer;font-size:18px;line-height:1}
  .card-fechar:hover{background:rgba(255,255,255,.32)}
  .card-ev{padding:13px 16px;border-top:1px solid var(--linha)}
  .card-ev:first-of-type{border-top:none}
  .card-ev.foco{background:var(--rosa)}
  .card-ev h3{margin:0;font-size:15px;line-height:1.3}
  .card-ev .quando{font-family:var(--cond);font-weight:700;font-size:16px;color:var(--vermelho-escuro);margin-bottom:3px}
  .card-ev dl{margin:8px 0 0;font-size:13px;line-height:1.45;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
  .card-ev dt{color:var(--cinza)}
  .card-ev dd{margin:0}
  .card-pe{padding:11px 16px 14px;border-top:1px solid var(--linha);font-size:12.5px;color:var(--cinza)}
  .card-pe a{color:var(--vermelho);font-weight:600}

  /* Crédito: no computador fica no canto de atribuição do mapa, no celular aparece no cabeçalho */
  .credito-topo{display:none;margin:3px 0 0;font-size:12px;color:var(--cinza)}
  .credito-topo a{color:inherit}
  .leaflet-control-attribution .credito{color:var(--tinta);font-weight:600}
  .leaflet-control-attribution .credito a{color:var(--vermelho-escuro);text-decoration:none}
  .leaflet-control-attribution .credito a:hover{text-decoration:underline}

  /* Painel largo: calendário e lista lado a lado */
  @media (min-width:1180px){
    .painel-corpo{grid-template-columns:minmax(340px,400px) minmax(0,1fr);overflow:hidden}
    /* scrollbar-gutter reserva o espaço da barra de rolagem (Windows) para ela não comer a lateral */
    .col-cal{overflow-y:auto;scrollbar-gutter:stable;border-right:1px solid var(--linha);padding:18px 18px 20px 24px}
    .col-lista{overflow-y:auto;padding-top:8px}
  }
  /* Celular: painel em cima, mapa embaixo, página rola */
  @media (max-width:820px){ .frase{max-width:none} }
  @media (max-width:820px){
    .credito-topo{display:block}
    .col-cal,.col-lista{padding-left:16px;padding-right:16px}
    .topo{padding:16px}
    #app{flex-direction:column;height:auto;overflow:visible}
    #painel{width:100%;border-right:none;border-bottom:1px solid var(--linha)}
    .painel-corpo{overflow:visible}
    #mapaWrap{height:70vh;flex:none}
    .lista-topo{position:static}
  }

  /* Visual limpo: fundo branco, cor só onde ela informa */
  .topo{padding-top:20px;background:linear-gradient(90deg,var(--verde) 0 25%,var(--amarelo) 25% 50%,var(--azul) 50% 75%,var(--vermelho) 75%) top/100% 4px no-repeat}
  .topo h1.marca{display:flex;align-items:center;gap:8px;font-family:var(--larga);font-stretch:125%;font-weight:900;font-size:28px;
       line-height:1;letter-spacing:0;text-transform:uppercase;color:var(--vermelho)}
  .marca span{padding:3px 8px 2px;border-radius:4px;background:var(--amarelo)}
  .marca .bandeira{height:1.02em;width:auto;flex:none;margin-left:2px}

  .frase{min-height:0;padding:2px 0 2px 14px;border:none;border-left:3px solid var(--amarelo);border-radius:0;background:none}
  .frase-texto{font-size:17px;font-weight:600;color:var(--tinta)}

  .cal{background:#fff;color:var(--tinta);border:1px solid var(--linha);border-radius:12px}
  .cal-nav button{border:1px solid var(--linha);color:var(--tinta)}
  .cal-nav button:hover{background:var(--fundo)}
  .cal-sem{opacity:1;color:var(--cinza)}
  .dia{color:#CFC9C9;border-radius:8px}
  .dia.tem{color:var(--tinta);background:#FDECEC}
  .dia.tem:hover{background:#F9D4D6}
  .dia.hoje{box-shadow:inset 0 0 0 2px var(--vermelho-escuro)}
  .dia.sel,.dia.sel:hover{background:var(--vermelho);color:#fff}
  .dia .qtd{color:var(--cinza);opacity:1}
  .dia .estrela{color:var(--vermelho)}
  .dia.sel .qtd,.dia.sel .estrela{color:#fff}
  .dia .ponto-lula,.leg-lula{background:var(--azul)}
  .dia.sel .ponto-lula{background:var(--amarelo);box-shadow:none}
  .cal-rodape{color:var(--cinza)}
  .cal-rodape span{opacity:1}
  .cal-rodape button{border:1px solid var(--linha);color:var(--tinta)}
  .cal-rodape button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}

  .filtros summary{font-size:17px;color:var(--tinta)}
  .chip{border-width:1px}
  .acoes button,select{border-width:1px}
  .acoes button:hover{border-color:var(--tinta);color:var(--tinta)}

  .lista-topo h2{font-size:26px}
  .grupo-dia{margin-top:22px;font-family:var(--texto);font-size:12.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--cinza)}
  .ev.ativo{background:#F6F4F4}
  .ev-tags{gap:3px 12px}
  .tag{padding:0;background:none;font-size:12px;font-weight:500;color:var(--cinza)}
  .tag.tipo{display:inline-flex;align-items:center;gap:5px;color:var(--cinza)}
  .tag.tipo i{width:8px;height:8px;border-radius:50%;flex:none}
  .tag.lula{background:none;color:var(--azul);font-weight:600}
  .tag.pendente{background:none;color:#8A6500}
  .tag.realizada{background:none;color:#2E7D3A}
  .tag.cancelada,.tag.semlocal{background:none;border:none;color:var(--cinza)}
  .ev .tag.realizada{display:none}

  #card{border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
  .card-topo,.card-topo.lula{background:#fff;color:var(--tinta);border-top:4px solid var(--vermelho);border-bottom:1px solid var(--linha);border-radius:12px 12px 0 0}
  .card-topo.lula{border-top-color:var(--azul)}
  .card-topo p{opacity:1;color:var(--cinza)}
  .card-topo.lula p{color:var(--azul)}
  .card-fechar{background:var(--fundo);color:var(--tinta)}
  .card-fechar:hover{background:var(--linha)}
  .card-ev.foco{background:#F6F4F4}
  .card-ev .quando{color:var(--vermelho)}
  .card-pe a,.leaflet-control-attribution .credito a{color:var(--vermelho)}
  .pin.sel{box-shadow:0 0 0 4px var(--amarelo),0 1px 4px rgba(0,0,0,.4)}
  :focus-visible{outline-color:var(--azul)}
  @media (max-width:520px){ .topo h1.marca{font-size:24px} }

  /* Cor de volta, com as quatro cores da campanha */
  .credito-topo a,.leaflet-control-attribution .credito a{color:#E30613 !important;font-weight:700}
  .leaflet-control-attribution .credito{color:var(--tinta)}

  .cal{border:none;padding:0;overflow:hidden;box-shadow:0 0 0 1px var(--linha)}
  .cal-nav{margin:0 0 10px;padding:10px 12px;background:var(--vermelho);color:#fff}
  .cal-nav button{border-color:rgba(255,255,255,.6);color:#fff}
  .cal-nav button:hover{background:rgba(255,255,255,.18)}
  .cal-grid{padding:0 12px}
  .cal-rodape{padding:0 12px 12px}
  .dia .ponto-lula,.leg-lula{background:var(--amarelo);box-shadow:0 0 0 1.5px var(--azul)}
  .dia.sel .ponto-lula{box-shadow:none}
  .cal-rodape button[aria-pressed="true"]{background:var(--vermelho);border-color:var(--vermelho)}

  .filtros summary{color:var(--azul)}
  .filtros h3{color:var(--verde-escuro);text-transform:uppercase;font-size:12px;letter-spacing:.5px}
  .chip[aria-pressed="true"]{border-color:var(--tinta)}
  .acoes button{border-color:var(--azul);color:var(--azul)}
  .acoes button:hover{background:var(--azul);border-color:var(--azul);color:#fff}
  .acoes #limpar{border-color:var(--linha);color:var(--cinza)}
  .acoes #limpar:hover{background:none;border-color:var(--vermelho);color:var(--vermelho)}

  .lista-topo{border-bottom:3px solid var(--amarelo)}
  .lista-topo h2{color:var(--azul)}
  .grupo-dia{display:inline-block;padding:3px 10px;border-radius:4px;background:var(--verde);color:#fff}
  .ev-hora{color:var(--vermelho)}
  .ev.ativo{background:#FFF6D6;box-shadow:inset 4px 0 0 var(--amarelo)}
  .ev-tags{gap:5px}
  .tag{padding:2px 8px;border-radius:20px;background:var(--fundo);font-size:11.5px;font-weight:600;color:var(--tinta)}
  .tag.tipo{display:inline-block;color:#fff}
  .tag.lula{background:var(--azul);color:var(--amarelo)}
  .tag.pendente{background:#FFF1B8;color:#6B4E00}
  .tag.realizada{background:#DDF3E1;color:#0B5E18}
  .tag.cancelada{background:#ECEAEA;color:#5E5656}

  .card-topo{background:var(--vermelho);color:#fff;border:none}
  .card-topo.lula{background:var(--azul);color:#fff;border:none}
  .card-topo p{color:#fff}
  .card-topo.lula p{color:var(--amarelo)}
  .card-fechar{background:rgba(255,255,255,.2);color:#fff}
  .card-fechar:hover{background:rgba(255,255,255,.35)}
  .card-ev.foco{background:#FFF6D6}
  .card-ev .quando{color:var(--azul)}
  #foraBH{border-left:4px solid var(--verde)}

  /* Ajustes: subtítulo, crédito, filtros por seleção e atalho de fora de BH */
  .topo p{font-size:15px}
  .topo p.credito-topo{display:block;margin-top:5px;font-size:14px}
  #fTipos .chip[aria-pressed="false"],#fStatus .chip[aria-pressed="false"]{opacity:1}
  #fTipos.tem-sel .chip[aria-pressed="false"],#fStatus.tem-sel .chip[aria-pressed="false"]{opacity:.45}
  .chip[aria-pressed="true"],.chip.status[aria-pressed="true"]{border-color:var(--tinta);background:#FFF6D6;font-weight:600}
  .chip.status[aria-pressed="false"]{border-color:var(--linha)}
  #foraBH{padding:0;border:none;background:none;box-shadow:none;max-width:230px;text-align:right}
  #foraBH .fora-btn{display:inline-flex;width:auto;gap:6px;padding:5px 11px;border-radius:20px;background:var(--amarelo);color:var(--tinta);
       font-size:12px;font-weight:600;box-shadow:0 1px 5px rgba(0,0,0,.25)}
  #foraBH .fora-btn:hover{background:#FFE14D;color:var(--tinta)}
  #foraBH .fora-lista{margin-top:6px;padding:6px 12px;max-height:50vh;overflow-y:auto;border-radius:10px;background:#fff;
       box-shadow:0 2px 10px rgba(0,0,0,.18);text-align:left}
  #foraBH .fora-lista button{font-size:13px}

  /* cabeçalho da lista colado no topo, sem fresta para a rolagem aparecer */
  .col-lista{padding-top:0 !important}
  .lista-topo{margin:0 -12px;padding:16px 12px 8px}

  /* Como chegar */
  .card-pe{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card-pe span{flex:1}
  .card-pe .btn-rota{display:inline-flex;align-items:center;gap:7px;flex:none;margin-left:auto;padding:8px 14px;border-radius:20px;
       background:#E6ECFF;color:var(--azul-escuro);font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap}
  .card-pe .btn-rota:hover{background:var(--azul);color:#fff}

  /* Celular: mapa em tela cheia */
  .ver-mapa,#voltarAgenda{display:none}
  @media (max-width:820px){
    .ver-mapa{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--azul)}
    body.mapa-cheio{overflow:hidden}
    body.mapa-cheio #mapaWrap{position:fixed;inset:0;height:100dvh;z-index:2000;background:#fff}
    body.mapa-cheio #map{top:48px}
    body.mapa-cheio #voltarAgenda{display:flex;align-items:center;position:absolute;top:0;left:0;right:0;height:48px;padding:0 16px;
         border:none;border-bottom:3px solid var(--amarelo);background:#fff;font-size:15px;font-weight:600;color:var(--azul);cursor:pointer;z-index:800}
    body.mapa-cheio #foraBH{top:60px}
    body.mapa-cheio #card{max-height:52%}
    .card-pe{flex-direction:column;align-items:stretch}
    .card-pe .btn-rota{justify-content:center;margin-left:0;padding:11px 14px}
  }

  .cal-rodape span[hidden]{display:none}
  .cal-rodape{justify-content:flex-start}
  .ev-hora.dia-todo{font-size:14px;line-height:1.3;color:var(--cinza)}
</style>
</head>

        <details class="filtros" id="filtrosBox" open>

          <div class="acoes">

            <button id="verMG">Ver Minas Gerais</button>
            <button id="limpar">Limpar filtros</button>
          </div>
        </details>
      </section>

      <section class="col-lista" aria-live="polite">
        <div class="lista-topo">
          <h2 id="listaTitulo"></h2>
          <p id="listaResumo"></p>
        </div>
        <ol id="lista"></ol>
      </section>
    </div>
  </aside>

  <main id="mapaWrap">
    <div id="map" aria-label="Mapa das atividades"></div>
    <button type="button" id="voltarAgenda">‹ Voltar para a agenda</button>
    <div id="foraBH"></div>
    <article id="card" aria-live="polite"></article>
  </main>
</div>

const TIPOS = {
  'Ato público':        'var(--t-ato)',
  'Mobilização de rua': 'var(--t-rua)',
  'Reunião e formação': 'var(--t-reuniao)',
  'Esporte com Lula':   'var(--t-esporte)',
  'Debate na TV':       'var(--t-tv)',
  'Eleição':            'var(--t-eleicao)'
};
const ORDEM_TIPO = Object.keys(TIPOS);
const TIPO_CLARO = new Set(['Esporte com Lula']); // fundo amarelo pede texto escuro
const STATUS = ['Programada','Pendente de confirmação','Realizada','Cancelada','Sem status'];
const NOTA_PRECISAO = {
  aproximada:'Ponto aproximado, pela referência do endereço.',
  regional:'Ponto no centro da regional, o local exato ainda não foi definido.',
  cidade:'Ponto no centro do município.'
};
const BH = [-19.9167,-43.9345];

/* ---------- Utilitários ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dataObj = iso => new Date(iso+'T12:00:00');
const fmtDia = (iso,op) => dataObj(iso).toLocaleDateString('pt-BR',op);
const hojeISO = (()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;})();
function minutos(h){
  if(!h) return 0; // sem horário: dia todo, vem primeiro
  if(/manh/i.test(h)) return 480;
  if(/tarde/i.test(h)) return 840;
  if(/noite/i.test(h)) return 1140;
  const m=h.match(/(\d{1,2}):(\d{2})/); return m? (+m[1])*60+(+m[2]) : 9999;
}
function distKm(a,b){ // distância aproximada entre dois pontos [lat,lng]
  const R=6371,r=Math.PI/180,dLat=(b[0]-a[0])*r,dLng=(b[1]-a[1])*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
EVENTOS.forEach((e,i)=>{ e.id=i; e.min=minutos(e.hora); });
EVENTOS.sort((a,b)=> a.data.localeCompare(b.data) || a.min-b.min);

/* ---------- Estado ---------- */
const diasComEvento = [...new Set(EVENTOS.map(e=>e.data))].sort();
const estado = {
  dia: null,                     // null = todos os dias
  mes: null,                     // 'AAAA-MM' exibido no calendário
  tiposOn: new Set(),
  statusOn: new Set(),
  frente: '',
  cardChave: null,               // ponto aberto no card
  eventoFoco: null
};
// dia inicial: hoje, se houver agenda; senão o próximo dia com agenda; senão todos
estado.dia = diasComEvento.includes(hojeISO) ? hojeISO : (diasComEvento.find(d=>d>hojeISO) || null);
estado.mes = (estado.dia || diasComEvento[0] || hojeISO).slice(0,7);

function passaFiltros(e){
  if(estado.tiposOn.size && !estado.tiposOn.has(e.tipo)) return false;
  if(estado.statusOn.size && !estado.statusOn.has(e.status)) return false;
  if(estado.frente && !e.frentes.includes(estado.frente)) return false;
  return true;
}
const filtrados = () => EVENTOS.filter(passaFiltros);
const doPeriodo = () => filtrados().filter(e=> !estado.dia || e.data===estado.dia);

/* ---------- Mapa ---------- */
const map = L.map('map',{zoomControl:true,zoomSnap:0.25}).setView(BH,11);
// crédito da autoria no canto de atribuição, antes das fontes do mapa
map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
  attribution:'Tiles &copy; Esri', maxZoom:16
}).addTo(map);
map.createPane('rotulos'); map.getPane('rotulos').style.zIndex=250; map.getPane('rotulos').style.pointerEvents='none';
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,pane:'rotulos'}).addTo(map);
const camadaMG = L.geoJSON(MG,{style:{color:'#0033CC',weight:1.8,opacity:.6,fill:false},interactive:false}).addTo(map);
const camadaPins = L.layerGroup().addTo(map);

const chave = e => `${e.lat.toFixed(4)},${e.lng.toFixed(4)}`;
function agrupar(lista){
  const g = new Map();
  lista.filter(e=>e.lat!=null).forEach(e=>{
    const k=chave(e); if(!g.has(k)) g.set(k,[]); g.get(k).push(e);
  });
  return g;
}

function iconePonto(evs, selecionado){
  const lula = evs.some(e=>e.lula);
  const tipo = ORDEM_TIPO.find(t=>evs.some(e=>e.tipo===t));
  const passado = evs.every(e=>e.status==='Realizada'||e.status==='Cancelada');
  const cancelada = evs.every(e=>e.status==='Cancelada');
  const pendente = evs.some(e=>e.status==='Pendente de confirmação');
  const cls = ['pin', lula&&'lula', passado&&'passado', cancelada&&'cancelada', pendente&&'pendente', selecionado&&'sel'].filter(Boolean).join(' ');
  const miolo = lula ? '★' : (evs.length>1 ? evs.length : '');
  const badge = (lula && evs.length>1) ? `<span class="n">${evs.length}</span>` : '';
  const tam = lula ? 36 : 22;
  return L.divIcon({className:'pin-wrap',iconSize:[tam,tam],iconAnchor:[tam/2,tam/2],
    html:`<div class="${cls}" style="--c:${TIPOS[tipo]};${TIPO_CLARO.has(tipo)?'color:#1A1A1A;':''}position:relative">${miolo}${badge}</div>`});
}

let grupos = new Map();
function desenharMapa(){
  camadaPins.clearLayers();
  grupos = agrupar(doPeriodo());
  grupos.forEach((evs,k)=>{
    const e0=evs[0];
    const m = L.marker([e0.lat,e0.lng],{icon:iconePonto(evs,k===estado.cardChave),keyboard:true,
      title:evs.length>1?`${e0.local} (${evs.length} atividades)`:e0.atividade,
      zIndexOffset: evs.some(e=>e.lula)?2000:0});
    m.on('click',()=>abrirCard(k));
    m.addTo(camadaPins);
  });
  desenharForaBH();
}

// Agendas longe da capital viram atalhos no canto do mapa
let foraAberto = false;
function desenharForaBH(){
  const box=$('foraBH');
  const longe=[...grupos.entries()].filter(([k,evs])=>distKm(BH,[evs[0].lat,evs[0].lng])>45);
  if(!longe.length){ box.className=''; box.innerHTML=''; return; }
  box.innerHTML=`<button class="fora-btn" aria-expanded="${foraAberto}">Fora da Grande BH (${longe.length})<span aria-hidden="true">${foraAberto?'▴':'▾'}</span></button>
    <div class="fora-lista"${foraAberto?'':' hidden'}>`+
    longe.map(([k,evs])=>{
      const cor=TIPOS[ORDEM_TIPO.find(t=>evs.some(e=>e.tipo===t))];
      const txt=estado.dia? evs[0].municipio : `${evs[0].municipio}, ${fmtDia(evs[0].data,{day:'numeric',month:'numeric'})}`;
      return `<button data-k="${k}"><span class="bola" style="background:${cor}"></span>${esc(txt)}</button>`;
    }).join('')+'</div>';
  box.querySelector('.fora-btn').onclick=()=>{ foraAberto=!foraAberto; desenharForaBH(); };
  box.querySelectorAll('.fora-lista button').forEach(b=>b.onclick=()=>{ abrirCard(b.dataset.k,null,true); });
  box.className='on';
}

function enquadrar(){
  const pts=[...grupos.values()].map(evs=>[evs[0].lat,evs[0].lng]);
  if(!pts.length) return;
  const perto=pts.filter(p=>distKm(BH,p)<=45);
  const alvo = perto.length ? perto : pts;
  if(alvo.length===1) map.setView(alvo[0], perto.length?14:10);
  else map.fitBounds(alvo,{padding:[40,40],maxZoom:14});
}

/* Leva o mapa até um ponto deixando-o fora da área coberta pelo card (canto inferior esquerdo) */
function voarPara(latlng, zoom){
  const w=$('map').clientWidth, cardW=Math.min(390, w-28);
  if(w>640){
    const p=map.project(latlng,zoom).subtract([cardW/2+12,0]);
    map.flyTo(map.unproject(p,zoom),zoom,{duration:.6});
  } else if(document.body.classList.contains('mapa-cheio')){
    // no celular em tela cheia o card cobre a parte de baixo, então o ponto sobe
    const p=map.project(latlng,zoom).add([0,$('map').clientHeight*0.2]);
    map.flyTo(map.unproject(p,zoom),zoom,{duration:.6});
  } else map.flyTo(latlng,zoom,{duration:.6});
}

/* ---------- Mapa em tela cheia (só no celular) ---------- */
const ehCelular = () => window.matchMedia('(max-width:820px)').matches;
let rolagemAgenda = 0;
function abrirMapaCheio(){
  if(document.body.classList.contains('mapa-cheio')) return;
  rolagemAgenda = window.scrollY;
  document.body.classList.add('mapa-cheio');
  history.pushState({mapaCheio:true},'');
  map.invalidateSize();
}
function fecharMapaCheio(){
  if(!document.body.classList.contains('mapa-cheio')) return;
  document.body.classList.remove('mapa-cheio');
  fecharCard();
  map.invalidateSize();
  window.scrollTo(0, rolagemAgenda);
}
// o botão de voltar do celular fecha o mapa em vez de sair do site
window.addEventListener('popstate', fecharMapaCheio);

/* ---------- Card ---------- */
function linkMapa(e){
  const q = e.lat!=null && e.precisao==='endereco' ? `${e.lat},${e.lng}` : `${e.local}, ${e.municipio||'Belo Horizonte'}, MG`;
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}`;
}
function tagsEvento(e){
  return [
    e.lula?'<span class="tag lula">★ Com o Lula</span>':'',
    `<span class="tag tipo" style="background:${TIPOS[e.tipo]}${TIPO_CLARO.has(e.tipo)?';color:#1A1A1A':''}">${esc(e.tipo)}</span>`,
    e.status==='Pendente de confirmação'?'<span class="tag pendente">A confirmar</span>':
    e.status==='Realizada'?'<span class="tag realizada">Realizada</span>':
    e.status==='Cancelada'?'<span class="tag cancelada">Cancelada</span>':'',
    e.diaD?'<span class="tag">Dia D</span>':'',
    e.precisao==='sem local'?'<span class="tag semlocal">Local a definir</span>':''
  ].join('');
}
function blocoEvento(e, mostrarData){
  const quando = [mostrarData?fmtDia(e.data,{weekday:'short',day:'numeric',month:'short'}):'', e.hora||'Durante o dia'].filter(Boolean).join(', ');
  return `<section class="card-ev${e.id===estado.eventoFoco?' foco':''}" id="card-ev-${e.id}">
    <div class="quando">${esc(quando)}</div>
    <h3>${esc(e.atividade)}</h3>
    <div class="ev-tags">${tagsEvento(e)}</div>
    <dl>
      ${e.frentes.length?`<dt>Frente</dt><dd>${esc(e.frentes.join(', '))}</dd>`:''}
      <dt>Local</dt><dd>${esc(e.local||'A definir')}</dd>
      ${e.responsavel?`<dt>Responsável</dt><dd>${esc(e.responsavel)}</dd>`:''}
      ${e.obs?`<dt>Observações</dt><dd>${esc(e.obs)}</dd>`:''}
      <dt>Situação</dt><dd>${esc(e.status)}</dd>
    </dl>
  </section>`;
}
function abrirCard(k, idEvento=null, voar=false){
  estado.cardChave=k; estado.eventoFoco=idEvento;
  const evs = k.startsWith('sem-') ? EVENTOS.filter(e=>e.id===+k.slice(4)) : (grupos.get(k)||[]);
  if(!evs.length){ fecharCard(); return; }
  const e0=evs[0], multiDias = new Set(evs.map(e=>e.data)).size>1 || !estado.dia;
  const titulo = e0.lat==null ? e0.atividade : (e0.precisao==='cidade' ? e0.municipio : e0.local);
  const sub = e0.lat==null ? (e0.precisao==='sem local' ? 'Local ainda não definido' : e0.local) :
              [e0.municipio!==titulo?e0.municipio:'Visita ao município', evs.length>1?`${evs.length} atividades neste ponto`:''].filter(Boolean).join(', ');
  const c=$('card');
  const comLula = evs.some(e=>e.lula);
  c.innerHTML=`<header class="card-topo${comLula?' lula':''}"><h2>${esc(titulo)}</h2><p>${esc(comLula?'Agenda com o Lula, '+sub:sub)}</p>
      <button class="card-fechar" aria-label="Fechar">×</button></header>
    ${evs.map(e=>blocoEvento(e,multiDias)).join('')}
    <footer class="card-pe">${NOTA_PRECISAO[e0.precisao]?`<span>${esc(NOTA_PRECISAO[e0.precisao])}</span>`:''}
      ${e0.local && e0.lat!=null?`<a class="btn-rota" href="${linkMapa(e0)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3z" fill="currentColor"/></svg>Como chegar</a>`:''}</footer>`;
  c.querySelector('.card-fechar').onclick=fecharCard;
  c.className='on'; c.scrollTop=0;
  if(idEvento!=null){ const alvo=$('card-ev-'+idEvento); if(alvo) alvo.scrollIntoView({block:'nearest'}); }
  if(voar && e0.lat!=null) voarPara([e0.lat,e0.lng], e0.precisao==='cidade'?10:15);
  desenharMapa(); marcarLista();
}
function fecharCard(){
  estado.cardChave=null; estado.eventoFoco=null;
  $('card').className=''; $('card').innerHTML='';
  desenharMapa(); marcarLista();
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(estado.cardChave) fecharCard();
});

/* ---------- Calendário ---------- */
function desenharCalendario(){
  const [ano,mes]=estado.mes.split('-').map(Number);
  const primeiro=new Date(ano,mes-1,1), nDias=new Date(ano,mes,0).getDate();
  $('mesNome').textContent=primeiro.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase());
  const cont={}, comLula=new Set();
  filtrados().forEach(e=>{ cont[e.data]=(cont[e.data]||0)+1; if(e.lula) comLula.add(e.data); });
  const g=$('calGrid'); g.innerHTML='';
  ['D','S','T','Q','Q','S','S'].forEach(s=>{const d=document.createElement('div');d.className='cal-sem';d.textContent=s;d.setAttribute('aria-hidden','true');g.appendChild(d);});
  for(let i=0;i<primeiro.getDay();i++){const d=document.createElement('div');d.className='dia vazio';g.appendChild(d);}
  for(let dia=1;dia<=nDias;dia++){
    const iso=`${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const b=document.createElement('button'); b.className='dia';
    const n=cont[iso]||0;
    b.innerHTML=`${dia}${n?`<span class="qtd">${n}</span>`:''}${comLula.has(iso)?'<span class="ponto-lula" aria-hidden="true"></span>':''}`;
    if(n){ b.classList.add('tem'); b.onclick=()=>selecionarDia(iso);
           b.setAttribute('aria-label',`${fmtDia(iso,{day:'numeric',month:'long'})}, ${n} atividade${n>1?'s':''}${comLula.has(iso)?', com agenda do Lula':''}`); }
    else { b.disabled=true; b.setAttribute('aria-label',`${dia}, sem atividades`); }
    if(iso===hojeISO) b.classList.add('hoje');
    if(iso===estado.dia){ b.classList.add('sel'); b.setAttribute('aria-pressed','true'); }
    g.appendChild(b);
  }
  // setas só avançam até meses com agenda
  const meses=[...new Set(diasComEvento.map(d=>d.slice(0,7)))];
  $('mesAnt').disabled = !meses.some(m=>m<estado.mes);
  $('mesProx').disabled = !meses.some(m=>m>estado.mes);
  $('btnTodos').setAttribute('aria-pressed', estado.dia?'false':'true');
}
function mudarMes(passo){
  const meses=[...new Set(diasComEvento.map(d=>d.slice(0,7)))];
  const alvo = passo<0 ? meses.filter(m=>m<estado.mes).pop() : meses.find(m=>m>estado.mes);
  if(alvo){ estado.mes=alvo; desenharCalendario(); }
}
function selecionarDia(iso){
  estado.dia = (estado.dia===iso) ? null : iso;
  if(estado.dia) estado.mes=estado.dia.slice(0,7);
  fecharCardSilencioso(); atualizar(true);
}
function fecharCardSilencioso(){ estado.cardChave=null; estado.eventoFoco=null; $('card').className=''; $('card').innerHTML=''; }

/* ---------- Lista ---------- */
function desenharLista(){
  const evs=doPeriodo(), ul=$('lista');
  const nLula=evs.filter(e=>e.lula).length, nSemLocal=evs.filter(e=>e.precisao==='sem local').length;
  $('listaTitulo').textContent = estado.dia ? fmtDia(estado.dia,{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase()) : 'Todos os dias';
  $('listaResumo').textContent = evs.length
    ? `${evs.length} atividade${evs.length>1?'s':''}${nLula?`, ${nLula} com o Lula`:''}${nSemLocal?`, ${nSemLocal} com local a definir`:''}`
    : '';
  if(!evs.length){
    ul.innerHTML=`<li class="vazio-msg">Nenhuma atividade com esses filtros${estado.dia?' neste dia':''}. Escolha outro dia no calendário ou use Limpar filtros.</li>`;
    return;
  }
  let html='', diaAtual=null;
  evs.forEach(e=>{
    if(!estado.dia && e.data!==diaAtual){ diaAtual=e.data;
      html+=`<li class="grupo-dia">${esc(fmtDia(e.data,{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase()))}</li>`; }
    const [h1,h2]=(e.hora||'').split('-');
    html+=`<li class="ev${e.status==='Cancelada'?' cancelada':''}" data-id="${e.id}" tabindex="0">
      <div class="ev-hora${h1?'':' dia-todo'}">${esc(h1||'Dia todo')}${h2?`<small>até ${esc(h2)}</small>`:''}</div>
      <div><div class="ev-titulo">${esc(e.atividade)}</div>
        <div class="ev-local">${esc(e.local||'Local a definir')}${e.municipio&&e.municipio!=='Belo Horizonte'&&e.municipio!==e.local?`, ${esc(e.municipio)}`:''}</div>
        <div class="ev-tags">${tagsEvento(e)}</div>
        <span class="ver-mapa">${e.lat!=null?'Ver no mapa':'Ver detalhes'} ›</span></div>
    </li>`;
  });
  ul.innerHTML=html;
  ul.querySelectorAll('.ev').forEach(li=>{
    const ir=()=>{ const e=EVENTOS.find(x=>x.id===+li.dataset.id);
      if(ehCelular()) abrirMapaCheio();
      abrirCard(e.lat!=null?chave(e):'sem-'+e.id, e.id, true); };
    li.onclick=ir; li.onkeydown=ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); ir(); } };
  });
  marcarLista();
}
function marcarLista(){
  document.querySelectorAll('#lista .ev').forEach(li=>{
    const e=EVENTOS.find(x=>x.id===+li.dataset.id);
    const k=e.lat!=null?chave(e):'sem-'+e.id;
    li.classList.toggle('ativo', k===estado.cardChave);
  });
}

/* ---------- Filtros ---------- */
function montarFiltros(){
  const ft=$('fTipos');
  ORDEM_TIPO.forEach(t=>{
    const n=EVENTOS.filter(e=>e.tipo===t).length;
    const b=document.createElement('button'); b.className='chip'; b.setAttribute('aria-pressed','false');
    b.innerHTML=`<span class="bola" style="background:${TIPOS[t]}"></span>${esc(t)} (${n})`;
    b.onclick=()=>{ estado.tiposOn.has(t)?estado.tiposOn.delete(t):estado.tiposOn.add(t);
      b.setAttribute('aria-pressed', estado.tiposOn.has(t)?'true':'false');
      ft.classList.toggle('tem-sel', estado.tiposOn.size>0); atualizar(false); };
    ft.appendChild(b);
  });
  const fs=$('fStatus');
  STATUS.filter(s=>EVENTOS.some(e=>e.status===s)).forEach(s=>{
    const b=document.createElement('button'); b.className='chip status'; b.setAttribute('aria-pressed','false');
    b.textContent=s;
    b.onclick=()=>{ estado.statusOn.has(s)?estado.statusOn.delete(s):estado.statusOn.add(s);
      b.setAttribute('aria-pressed', estado.statusOn.has(s)?'true':'false');
      fs.classList.toggle('tem-sel', estado.statusOn.size>0); atualizar(false); };
    fs.appendChild(b);
  });
  const cont={}; EVENTOS.forEach(e=>e.frentes.forEach(f=>cont[f]=(cont[f]||0)+1));
  Object.keys(cont).sort((a,b)=>a.localeCompare(b)).forEach(f=>{
    const o=document.createElement('option'); o.value=f; o.textContent=`${f} (${cont[f]})`; $('fFrente').appendChild(o);
  });
  $('fFrente').onchange=e=>{ estado.frente=e.target.value; atualizar(false); };
  $('btnTodos').onclick=()=>{ estado.dia=null; fecharCardSilencioso(); atualizar(true); };
  $('mesAnt').onclick=()=>mudarMes(-1); $('mesProx').onclick=()=>mudarMes(1);
  $('verBH').onclick=()=>map.setView(BH,12);
  $('verMG').onclick=()=>map.fitBounds(camadaMG.getBounds(),{padding:[10,10]});
  $('limpar').onclick=()=>{
    estado.tiposOn.clear(); estado.statusOn.clear(); estado.frente='';
    $('fFrente').value='';
    document.querySelectorAll('#fTipos .chip,#fStatus .chip').forEach(c=>c.setAttribute('aria-pressed','false'));
    $('fTipos').classList.remove('tem-sel'); $('fStatus').classList.remove('tem-sel');
    fecharCardSilencioso(); atualizar(true);
  };
}

function atualizar(reenquadrar){
  // se o card aberto ficou sem eventos visíveis, fecha
  desenharCalendario(); desenharMapa(); desenharLista();
  if(estado.cardChave && !estado.cardChave.startsWith('sem-') && !grupos.has(estado.cardChave)) fecharCardSilencioso();
  if(reenquadrar) enquadrar();
}

// no celular os filtros começam recolhidos para o mapa aparecer mais cedo
if(window.matchMedia('(max-width:820px)').matches) $('filtrosBox').removeAttribute('open');

/* ---------- Frases do cabeçalho ---------- */
const FRASES = [
  {t:'Não há mudança sem sonho como não há sonho sem esperança.', a:'Paulo Freire', ano:1992},
  {t:'O mundo não é. O mundo está sendo.', a:'Paulo Freire', ano:1996},
  {t:'O Brasil precisa ser dirigido por uma pessoa que já passou fome.', a:'Carolina Maria de Jesus', ano:1960},
  {t:'Quem tem fome tem pressa.', a:'Betinho', ano:1993},
  {t:'A esperança venceu o medo.', a:'Lula', ano:2002},
  {t:'Viver significa tomar partido.', a:'Antonio Gramsci', ano:1917},
  {t:'A história é nossa, e são os povos que a fazem.', a:'Salvador Allende', ano:1973},
  {t:'Lutei pelo justo, pelo bom e pelo melhor do mundo.', a:'Olga Benário', ano:1942},
  {t:'Não serei interrompida.', a:'Marielle Franco', ano:2018},
  {t:'Para que serve a utopia? Serve para isso: para caminhar.', a:'Eduardo Galeano', ano:1993},
  {t:'Quando a mulher negra se movimenta, toda a estrutura da sociedade se movimenta com ela.', a:'Angela Davis', ano:2017},
  {t:'A injustiça em qualquer lugar é uma ameaça à justiça em todo lugar.', a:'Martin Luther King Jr.', ano:1963},
  {t:'Nenhuma família sem casa. Nenhum camponês sem terra! Nenhum trabalhador sem direitos!', a:'Papa Francisco', ano:2014},
  {t:'Não poderá haver paz sem justiça, e os pobres recordam-nos isso de muitas maneiras.', a:'Papa Leão XIV', ano:2025},
  {t:'A caridade é uma força que muda a realidade, um autêntico poder histórico de transformação.', a:'Papa Leão XIV', ano:2025}
];
let fraseI = Math.floor(Math.random()*FRASES.length), fraseTimer;
const fraseSemFade = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function mostrarFrase(){
  const f = FRASES[fraseI];
  $('fraseTexto').textContent = `“${f.t}”`;
  $('fraseAutor').textContent = `${f.a} (${f.ano})`;
}
function proximaFrase(){
  const box = $('frase');
  const trocar = () => { fraseI = (fraseI+1) % FRASES.length; mostrarFrase(); box.classList.remove('troca'); };
  if(fraseSemFade){ trocar(); return; }
  box.classList.add('troca');
  setTimeout(trocar, 350);
}
function rodarFrases(){ clearInterval(fraseTimer); fraseTimer = setInterval(proximaFrase, 9000); }
$('frase').onclick = () => { proximaFrase(); rodarFrases(); };
$('frase').onmouseenter = () => clearInterval(fraseTimer);
$('frase').onmouseleave = rodarFrases;
mostrarFrase(); rodarFrases();

$('voltarAgenda').onclick = () => history.back();
$('legLula').hidden = !EVENTOS.some(e=>e.lula);
montarFiltros();
atualizar(true);
</script>
